name: release

# Bump every affected script (own tag, own CHANGELOG.md, own GitHub release), then
# build the static site and publish it to GitHub Pages. Built userscripts are not
# committed — they are generated here and shipped with the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release reads tags and the whole history
          fetch-depth: 0
          # the userscript-maker CLI is a submodule: `usm` is its TypeScript entry
          submodules: recursive

      - name: Install node
        uses: actions/setup-node@v7
        with:
          # semantic-release 26 needs >= 26.13
          node-version: 26

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump versions, changelogs and tags per script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun tools/release/release-all.ts

      - name: Make sure the commits semantic-release just pushed are here
        run: git pull --ff-only

      - name: Build userscripts and the catalog
        run: |
          bun run usm:build
          bun run usm:catalog

      - name: Build the static site
        env:
          # project page → https://<owner>.github.io/<repo>/
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Disable Jekyll processing
        run: touch .output/public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
