name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the userscript-maker CLI is a submodule: `usm` is its TypeScript entry
          submodules: recursive

      - name: Install node
        uses: actions/setup-node@v7
        with:
          # the release tooling in tools/ runs semantic-release, which needs >= 26.13
          node-version: 26

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check userscripts
        run: bun run usm:check

      - name: Test userscripts and the release tooling
        run: bun test
